function zone(ix,iz){if(ix*ix+iz*iz<144)return 0;let key=ix*100003+iz,v=ZC.get(key);if(v!==undefined)return v;let u=ix/7,w=iz/7,a=Math.floor(u),b=Math.floor(w),fu=u-a,fw=w-b;fu=fu*fu*(3-2*fu);fw=fw*fw*(3-2*fw);let n=vn(a,b)*(1-fu)*(1-fw)+vn(a+1,b)*fu*(1-fw)+vn(a,b+1)*(1-fu)*fw+vn(a+1,b+1)*fu*fw;v=n<.3?2:n<.38?1:0;if(ZC.size>8000)ZC.clear();ZC.set(key,v);return v}
function solid(x,z){let ix=Math.round(x/P),iz=Math.round(z/P),zn=zone(ix,iz);if(zn===2)return true;return zn===0&&h(ix,iz)%6!==0&&Math.abs(x-ix*P)<15&&Math.abs(z-iz*P)<15}
function psolid(x,z){let ix=Math.round(x/P),iz=Math.round(z/P);return zone(ix,iz)===0&&h(ix,iz)%6!==0&&Math.abs(x-ix*P)<15&&Math.abs(z-iz*P)<15}

// ============================================================================
// COLISÃO SÓLIDA CÍRCULO vs CAIXA ORIENTADA (OBB) PARA CARROS PARADOS E MÓVEIS
// ============================================================================
function resolveCarCircleCollision(x,z,rad,ignoreCar){
  let outX=x,outZ=z,hitCar=null,hitSpeed=0;
  for(let i=0;i<cars.length;i++){
    let c=cars[i];
    if(!c||c===ignoreCar)continue;
    let t=CT[c.type]||CT[0];
    let hw=(t[0]||1.0)+rad;
    let hl=(t[1]||2.2)+rad;
    let s=sin(c.yaw||0),cY=cos(c.yaw||0);
    let dx=outX-c.x,dz=outZ-c.z;
    let lx=dx*cY-dz*s;
    let lz=dx*s+dz*cY;
    if(Math.abs(lx)<hw&&Math.abs(lz)<hl){
      let penX=hw-Math.abs(lx);
      let penZ=hl-Math.abs(lz);
      if(penX<penZ)lx=(lx>=0?1:-1)*hw;
      else lz=(lz>=0?1:-1)*hl;
      outX=c.x+lx*cY+lz*s;
      outZ=c.z-lx*s+lz*cY;
      hitCar=c;
      hitSpeed=Math.max(hitSpeed,Math.abs(c.spd||0));
    }
  }
  return {x:outX,z:outZ,hit:!!hitCar,car:hitCar,spd:hitSpeed};
}

const VOICE_PROFILES={
  civil:{pitch:1.05,rate:1.02,cd:3.8,freq:210},

let ptVoices=[],lastVoiceMs=0,lastSpokenLine='',audioCtx=null,userGestured=false;
const hasSpeech=typeof window!=='undefined'&&'speechSynthesis'in window&&typeof window.SpeechSynthesisUtterance==='function';
function refreshVoices(){
  try{
    if(!hasSpeech)return;
    const list=window.speechSynthesis.getVoices()||[];
    ptVoices=list.filter(v=>/pt(-|_)?(BR|PT)?/i.test((v.lang||'')+' '+(v.name||'')));
  }catch(_){}
}
if(hasSpeech){
  refreshVoices();
  try{window.speechSynthesis.onvoiceschanged=refreshVoices;}catch(_){}
}
function unlockAudio(){
  userGestured=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC&&!audioCtx)audioCtx=new AC();
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  }catch(_){}
}
function playVocalBlip(freq,vol){
  if(!userGestured)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(freq,now);
    osc.frequency.exponentialRampToValueAtTime(freq*1.22,now+0.07);
    osc.frequency.exponentialRampToValueAtTime(freq*0.86,now+0.16);
    gain.gain.setValueAtTime(0.001,now);
    gain.gain.linearRampToValueAtTime(0.055*vol,now+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,now+0.17);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(now);osc.stop(now+0.18);
  }catch(_){}
}
function speakLine(e,text){
  if(!e||!text||paused||!userGestured)return;
  const now=performance.now();
  const dist=Math.hypot((e.x||0)-player.x,(e.z||0)-player.z);
  if(dist>32)return;
  if((e.voiceCd||0)>0)return;
  if(now-lastVoiceMs<1250)return;
  if(text===lastSpokenLine&&now-lastVoiceMs<5000)return;
  const prof=VOICE_PROFILES[e.role]||VOICE_PROFILES.civil;
  const vol=cl(1-(dist/36),0.22,1);
  e.voiceCd=prof.cd;
  lastVoiceMs=now;
  lastSpokenLine=text;
  if(hasSpeech){
    try{
      if(window.speechSynthesis.speaking||window.speechSynthesis.pending){
        window.speechSynthesis.cancel();
      }
      const utt=new window.SpeechSynthesisUtterance(text);
      utt.lang='pt-BR';
      if(ptVoices.length)utt.voice=ptVoices[(e.seed||0)%ptVoices.length];
      const offset=(((e.seed||1)%7)-3)*0.03;
      utt.pitch=cl(prof.pitch+offset,0.5,1.8);
      utt.rate=cl(prof.rate*(1-cl(dist/48,0,0.12)),0.75,1.45);
      utt.volume=vol;
      utt.onerror=()=>playVocalBlip(prof.freq,vol);
      window.speechSynthesis.speak(utt);
      return;
    }catch(_){}
  }
  playVocalBlip(prof.freq,vol);
}
